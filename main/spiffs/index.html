<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="card">
        <h1>ESP32 Server</h1>
        <p>Files successfully served from internal SPIFFS flash!</p>
        
        <div class="stats">
            Session Time: <span id="uptime">00:00</span>
        </div>

        <button id="theme-btn">Switch to Light Mode</button>
    </div>

    <div class="card">
        <h1>Chat box</h1>
        <div id="chat-window"></div>
        <div class="input-box">
            <input type="text" id="username" placeholder="Username...">
            <input type="text" id="message" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
    
    <script src="/script.js"></script>
</body>
</html>
